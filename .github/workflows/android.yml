
name: Build God Perfection Unlocker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.godperfection \
            --project-name god_perfection_unlocker .

      - name: Create app screen
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const UnlockerApp());
          }

          class UnlockerApp extends StatelessWidget {
            const UnlockerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'God Perfection Unlocker',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF101010),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFD4AF37),
                  ),
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text(
                    'GOD PERFECTION UNLOCKER',
                    style: TextStyle(
                      color: Color(0xFFD4AF37),
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(20),
                  children: [
                    const Icon(
                      Icons.phonelink_setup,
                      color: Color(0xFFD4AF37),
                      size: 90,
                    ),
                    const Center(
                      child: Text(
                        'Professional Phone Servicing',
                        style: TextStyle(
                          color: Color(0xFFD4AF37),
                          fontSize: 21,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                    const SizedBox(height: 25),
                    serviceCard(
                      Icons.usb,
                      'USB Device Manager',
                      'USB detection is coming next.',
                    ),
                    serviceCard(
                      Icons.phone_android,
                      'Android Services',
                      'Supported Android recovery tools.',
                    ),
                    serviceCard(
                      Icons.apple,
                      'iPhone Services',
                      'Official iPhone support information.',
                    ),
                    serviceCard(
                      Icons.build,
                      'Phone Diagnostics',
                      'Device testing and repair assistance.',
                    ),
                    serviceCard(
                      Icons.history,
                      'Repair History',
                      'Repair records will be added here.',
                    ),
                    const SizedBox(height: 25),
                    const Center(
                      child: Text(
                        'GOD PERFECTION TECH',
                        style: TextStyle(color: Colors.white54),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          Widget serviceCard(
            IconData icon,
            String title,
            String description,
          ) {
            return Card(
              color: const Color(0xFF202020),
              margin: const EdgeInsets.only(bottom: 14),
              child: ListTile(
                leading: Icon(
                  icon,
                  color: const Color(0xFFD4AF37),
                  size: 32,
                ),
                title: Text(
                  title,
                  style: const TextStyle(fontWeight: FontWeight.bold),
                ),
                subtitle: Text(description),
              ),
            );
          }
          EOF

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: God-Perfection-Unlocker-APK
          path: build/app/outputs/flutter-apk/app-release.apk
