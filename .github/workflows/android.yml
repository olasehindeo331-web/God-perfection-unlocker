
name: Build God Perfection Unlocker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android --org com.godperfection --project-name god_perfection_unlocker .

      - name: Add USB host feature
        run: |
          sed -i '/<manifest /a\    <uses-feature android:name="android.hardware.usb.host" android:required="false" />' android/app/src/main/AndroidManifest.xml

      - name: Add native USB detection
        run: |
          mkdir -p android/app/src/main/kotlin/com/godperfection/god_perfection_unlocker
          cat > android/app/src/main/kotlin/com/godperfection/god_perfection_unlocker/MainActivity.kt <<'EOF'
          package com.godperfection.god_perfection_unlocker

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.usb.UsbManager
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "godperfection/usb"
              private val permissionAction = "com.godperfection.god_perfection_unlocker.USB_PERMISSION"
              private lateinit var usbManager: UsbManager

              private val usbReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context, intent: Intent) {
                      if (intent.action == permissionAction) {
                          // Permission result is available when the app refreshes its device list.
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  usbManager = getSystemService(Context.USB_SERVICE) as UsbManager

                  val filter = IntentFilter(permissionAction)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(usbReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(usbReceiver, filter)
                  }
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(usbReceiver)
                  } catch (_: Exception) {
                  }
                  super.onDestroy()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "getDevices" -> result.success(getUsbDevices())

                          "requestPermission" -> {
                              val name = call.argument<String>("deviceName")
                              val device = usbManager.deviceList.values
                                  .firstOrNull { it.deviceName == name }

                              if (device == null) {
                                  result.error("NOT_FOUND", "USB device not found", null)
                              } else if (usbManager.hasPermission(device)) {
                                  result.success("Permission already granted")
                              } else {
                                  val intent = Intent(permissionAction).setPackage(packageName)
                                  val pendingIntent = PendingIntent.getBroadcast(
                                      this,
                                      0,
                                      intent,
                                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                                  )
                                  usbManager.requestPermission(device, pendingIntent)
                                  result.success("Permission request sent")
                              }
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun getUsbDevices(): List<Map<String, Any>> {
                  return usbManager.deviceList.values.map { device ->
                      mapOf(
                          "deviceName" to device.deviceName,
                          "vendorId" to device.vendorId,
                          "productId" to device.productId,
                          "deviceClass" to device.deviceClass,
                          "interfaceCount" to device.interfaceCount,
                          "permissionGranted" to usbManager.hasPermission(device)
                      )
                  }
              }
          }
          EOF

      - name: Add Flutter application screen
        run: |
          cat > lib/main.dart <<'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            runApp(const UnlockerApp());
          }

          class UnlockerApp extends StatelessWidget {
            const UnlockerApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'God Perfection Unlocker',
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF101010),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFD4AF37),
                  ),
                ),
                home: const UsbHomePage(),
              );
            }
          }

          class UsbHomePage extends StatefulWidget {
            const UsbHomePage({super.key});

            @override
            State<UsbHomePage> createState() => _UsbHomePageState();
          }

          class _UsbHomePageState extends State<UsbHomePage> {
            static const usbChannel = MethodChannel('godperfection/usb');

            List<Map<String, dynamic>> devices = [];
            String message = 'Connect a phone or USB device using OTG.';
            bool loading = false;

            Future<void> scanDevices() async {
              setState(() {
                loading = true;
                message = 'Checking USB connection...';
              });

              try {
                final result = await usbChannel.invokeMethod<List<dynamic>>(
                  'getDevices',
                );

                final found = (result ?? []).map((item) =>
                    Map<String, dynamic>.from(item as Map)).toList();

                setState(() {
                  devices = found;
                  message = found.isEmpty
                      ? 'No USB devices detected. Check your OTG connection and cable.'
                      : 'Found ${found.length} USB device(s).';
                });
              } on PlatformException catch (e) {
                setState(() {
                  message = 'USB error: ${e.message}';
                });
              } catch (e) {
                setState(() {
                  message = 'Could not scan USB devices: $e';
                });
              }

              setState(() {
                loading = false;
              });
            }

            Future<void> requestDevicePermission(
                Map<String, dynamic> device) async {
              try {
                final response = await usbChannel.invokeMethod<String>(
                  'requestPermission',
                  {'deviceName': device['deviceName']},
                );

                setState(() {
                  message = response ?? 'Permission request sent.';
                });
              } on PlatformException catch (e) {
                setState(() {
                  message = 'Permission error: ${e.message}';
                });
              }
            }

            Widget serviceCard(IconData icon, String title, String detail) {
              return Card(
                color: const Color(0xFF202020),
                child: ListTile(
                  leading: Icon(icon, color: const Color(0xFFD4AF37), size: 30),
                  title: Text(title),
                  subtitle: Text(detail),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: Colors.black,
                  title: const Text(
                    'GOD PERFECTION UNLOCKER',
                    style: TextStyle(
                      color: Color(0xFFD4AF37),
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(18),
                  children: [
                    const Icon(
                      Icons.phonelink_setup,
                      color: Color(0xFFD4AF37),
                      size: 76,
                    ),
                    const Center(
                      child: Text(
                        'PROFESSIONAL PHONE SERVICING',
                        style: TextStyle(
                          color: Color(0xFFD4AF37),
                          fontSize: 17,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                    ),
                    const SizedBox(height: 22),
                    const Text(
                      'USB DEVICE MANAGER',
                      style: TextStyle(
                        color: Color(0xFFD4AF37),
                        fontWeight: FontWeight.bold,
                        fontSize: 18,
                      ),
                    ),
                    const SizedBox(height: 10),
                    Card(
                      color: const Color(0xFF202020),
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Text(message),
                            const SizedBox(height: 14),
                            ElevatedButton.icon(
                              onPressed: loading ? null : scanDevices,
                              icon: const Icon(Icons.usb),
                              label: Text(
                                loading ? 'SCANNING...' : 'SCAN USB DEVICES',
                              ),
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFFD4AF37),
                                foregroundColor: Colors.black,
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    if (devices.isNotEmpty) ...[
                      const SizedBox(height: 14),
                      const Text(
                        'DETECTED DEVICES',
                        style: TextStyle(
                          color: Color(0xFFD4AF37),
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      for (final device in devices)
                        Card(
                          color: const Color(0xFF202020),
                          child: Padding(
                            padding: const EdgeInsets.all(14),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text(
                                  device['deviceName'].toString(),
                                  style: const TextStyle(
                                    fontWeight: FontWeight.bold,
                                  ),
                                ),
                                const SizedBox(height: 8),
                                Text('Vendor ID: ${device['vendorId']}'),
                                Text('Product ID: ${device['productId']}'),
                                Text('USB class: ${device['deviceClass']}'),
                                Text('Interfaces: ${device['interfaceCount']}'),
                                Text(
                                  'Permission: ${device['permissionGranted'] == true ? 'Granted' : 'Not granted'}',
                                ),
                                const SizedBox(height: 8),
                                OutlinedButton(
                                  onPressed: () => requestDevicePermission(device),
                                  child: const Text('REQUEST USB PERMISSION'),
                                ),
                              ],
                            ),
                          ),
                        ),
                    ],
                    const SizedBox(height: 20),
                    const Text(
                      'OTHER SERVICING MODULES',
                      style: TextStyle(
                        color: Color(0xFFD4AF37),
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    serviceCard(Icons.android, 'Android Services',
                        'Authorized recovery and supported software repair.'),
                    serviceCard(Icons.apple, 'iPhone Services',
                        'Official diagnostics and recovery support.'),
                    serviceCard(Icons.build, 'Phone Diagnostics',
                        'Device testing and repair assistance.'),
                    serviceCard(Icons.history, 'Repair History',
                        'Repair records will be added in a later update.'),
                    const SizedBox(height: 20),
                    const Center(
                      child: Text(
                        'GOD PERFECTION TECH',
                        style: TextStyle(color: Colors.white54),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: God-Perfection-Unlocker-APK
          path: build/app/outputs/flutter-apk/app-release.apk
